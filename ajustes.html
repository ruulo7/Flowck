<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajustes — Flowck</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="sidebar"></div>

<div class="main">
  <div id="topbar"></div>

  <div class="content-header">
    <div class="page-header">
      <h1 class="page-title">Ajustes</h1>
    </div>
  </div>

  <div class="content">
    <div class="settings-page">

      <!-- ── Workspace ── -->
      <div class="settings-section">
        <h2 class="settings-section-title">Workspace</h2>
        <div class="settings-card">
          <div class="settings-workspace-row">
            <div class="settings-workspace-logo" id="wsLogoPreview" style="background:#F59E0B">PA</div>
            <div class="settings-workspace-field">
              <label class="form-label">Nombre del workspace</label>
              <input type="text" class="form-input" id="wsNameInput" value="Pulse Agency">
            </div>
            <div class="settings-save-wrap">
              <button class="btn btn-primary" id="wsSaveBtn">Guardar cambios</button>
              <span class="settings-save-confirm" id="wsSaveConfirm">Guardado ✓</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Equipo ── -->
      <div class="settings-section">
        <div class="settings-section-header">
          <h2 class="settings-section-title">Equipo</h2>
          <button class="btn btn-primary" id="addMemberBtn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Añadir miembro
          </button>
        </div>
        <div class="settings-card" id="teamCard">
          <div class="member-list" id="memberList"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal: Añadir miembro -->
<div class="modal-overlay" id="addMemberOverlay">
  <div class="modal" style="width:420px">
    <div class="modal-header">
      <span class="modal-title">Añadir miembro</span>
      <button class="modal-close" id="addMemberClose">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Nombre completo <span class="required-star">*</span></label>
      <input class="form-input" id="newMemberName" type="text" placeholder="Ej. Pedro Sánchez">
    </div>
    <div class="form-group">
      <label class="form-label">Rol <span class="required-star">*</span></label>
      <select class="form-select" id="newMemberRole">
        <option value="">Selecciona un rol</option>
        <option value="manager">Manager</option>
        <option value="content">Content</option>
        <option value="diseño">Diseño</option>
        <option value="social">Social Media</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="addMemberCancel">Cancelar</button>
      <button class="btn btn-primary" id="addMemberSave" disabled>Añadir miembro</button>
    </div>
  </div>
</div>

<!-- Modal: Confirmar eliminar miembro -->
<div class="modal-overlay" id="deleteMemberOverlay">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <span class="modal-title">Eliminar miembro</span>
      <button class="modal-close" id="deleteMemberClose">✕</button>
    </div>
    <p style="font-size:13.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:16px">
      Esta acción eliminará al miembro del workspace. No se puede deshacer.
    </p>
    <div id="deleteMemberPreview" style="display:flex;align-items:center;gap:10px;background:#F5F5F3;border-radius:8px;padding:10px 14px;margin-bottom:4px">
      <div id="deleteMemberAvatar" class="member-avatar" style="background:#999"></div>
      <span id="deleteMemberNameLabel" style="font-size:13.5px;font-weight:500;color:var(--text-primary)"></span>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="deleteMemberCancel">Cancelar</button>
      <button class="btn btn-danger" id="deleteMemberConfirm">Eliminar</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('sidebar').innerHTML = renderSidebar('ajustes');
  document.getElementById('topbar').innerHTML  = renderTopbar();

  /* ── Helpers ─────────────────────────────── */
  function getMemberInitials(name) {
    const w = name.trim().split(/\s+/);
    return w.length >= 2 ? (w[0][0] + w[1][0]).toUpperCase() : name.slice(0, 2).toUpperCase();
  }

  /* ── Workspace ───────────────────────────── */
  function loadWorkspace() {
    const ws = getWorkspace();
    document.getElementById('wsNameInput').value = ws.name;
    document.getElementById('wsLogoPreview').style.background = ws.color || '#F59E0B';
    updateLogoPreview(ws.name);
  }

  function updateLogoPreview(name) {
    const w = (name || '').trim().split(/\s+/);
    const init = w.length >= 2
      ? (w[0][0] + w[1][0]).toUpperCase()
      : (name || 'W').slice(0, 2).toUpperCase();
    document.getElementById('wsLogoPreview').textContent = init;
  }

  document.getElementById('wsNameInput').addEventListener('input', function() {
    updateLogoPreview(this.value);
  });

  document.getElementById('wsSaveBtn').addEventListener('click', function() {
    const name = document.getElementById('wsNameInput').value.trim();
    if (!name) return;
    const ws = getWorkspace();
    saveWorkspace({ ...ws, name });
    document.getElementById('sidebar').innerHTML = renderSidebar('ajustes');
    const c = document.getElementById('wsSaveConfirm');
    c.style.opacity = '1';
    setTimeout(() => { c.style.opacity = '0'; }, 2200);
  });

  /* ── Team list ───────────────────────────── */
  const FULL_NAMES = {
    'María G.':  'María García',
    'Carlos R.': 'Carlos Rodríguez',
    'Julia B.':  'Julia Benítez',
    'Ana R.':    'Ana Ruiz',
    'David M.':  'David Morales',
  };

  let pendingDeleteName = null;

  function renderMemberList() {
    const users = getUsers().filter(u => u.role !== 'cliente');
    const html = users.map(u => {
      const displayName = FULL_NAMES[u.name] || u.name;
      return `<div class="member-row">
      <div class="member-avatar" style="background:${u.color}">${getMemberInitials(u.name)}</div>
      <div class="member-info">
        <span class="member-name">${displayName}</span>
        <span class="member-role">${ROLE_LABELS[u.role] || u.role}</span>${u.name === 'María G.' ? ' <span style="color:#9B9B97;font-size:11.5px">(Tú)</span>' : ''}
      </div>
      <button class="member-trash-btn" data-name="${u.name.replace(/"/g, '&quot;')}" title="Eliminar miembro">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
          <path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </div>`;
    }).join('');
    document.getElementById('memberList').innerHTML = html;
    document.querySelectorAll('.member-trash-btn').forEach(btn => {
      btn.addEventListener('click', function() { openDeleteMember(this.dataset.name); });
    });
  }

  function openDeleteMember(name) {
    pendingDeleteName = name;
    const user = getUsers().find(u => u.name === name);
    document.getElementById('deleteMemberNameLabel').textContent = name;
    document.getElementById('deleteMemberAvatar').textContent = getMemberInitials(name);
    document.getElementById('deleteMemberAvatar').style.background = user ? user.color : '#6B6B6B';
    document.getElementById('deleteMemberOverlay').classList.add('open');
  }

  document.getElementById('deleteMemberConfirm').addEventListener('click', function() {
    if (!pendingDeleteName) return;
    saveExtraUsers(getExtraUsers().filter(u => u.name !== pendingDeleteName));
    pendingDeleteName = null;
    document.getElementById('deleteMemberOverlay').classList.remove('open');
    renderMemberList();
  });

  function closeDeleteModal() {
    document.getElementById('deleteMemberOverlay').classList.remove('open');
  }
  document.getElementById('deleteMemberClose').addEventListener('click', closeDeleteModal);
  document.getElementById('deleteMemberCancel').addEventListener('click', closeDeleteModal);
  document.getElementById('deleteMemberOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeDeleteModal();
  });

  /* ── Add member modal ────────────────────── */
  function validateAddMember() {
    const name = document.getElementById('newMemberName').value.trim();
    const role = document.getElementById('newMemberRole').value;
    document.getElementById('addMemberSave').disabled = !(name && role);
  }

  document.getElementById('newMemberName').addEventListener('input', validateAddMember);
  document.getElementById('newMemberRole').addEventListener('change', validateAddMember);

  document.getElementById('addMemberBtn').addEventListener('click', function() {
    document.getElementById('newMemberName').value = '';
    document.getElementById('newMemberRole').value = '';
    document.getElementById('addMemberSave').disabled = true;
    document.getElementById('addMemberOverlay').classList.add('open');
    setTimeout(() => document.getElementById('newMemberName').focus(), 50);
  });

  function closeAddModal() {
    document.getElementById('addMemberOverlay').classList.remove('open');
  }
  document.getElementById('addMemberClose').addEventListener('click', closeAddModal);
  document.getElementById('addMemberCancel').addEventListener('click', closeAddModal);
  document.getElementById('addMemberOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeAddModal();
  });

  document.getElementById('addMemberSave').addEventListener('click', function() {
    const name = document.getElementById('newMemberName').value.trim();
    const role = document.getElementById('newMemberRole').value;
    if (!name || !role) return;

    if (getUsers().find(u => u.name.toLowerCase() === name.toLowerCase())) {
      document.getElementById('newMemberName').style.borderColor = '#EF4444';
      document.getElementById('newMemberName').title = 'Ya existe un miembro con ese nombre';
      return;
    }
    document.getElementById('newMemberName').style.borderColor = '';

    const extra = getExtraUsers();
    const color = AVATAR_PALETTE[extra.length % AVATAR_PALETTE.length];
    extra.push({ name, role, color });
    saveExtraUsers(extra);
    closeAddModal();
    renderMemberList();
  });

  /* ── Boot ────────────────────────────────── */
  loadWorkspace();
  renderMemberList();
</script>
</body>
</html>
